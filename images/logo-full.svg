<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="GRC Hub — AI governance and control">
  <!-- Full lock-up: original mark + wordmark. Palette inspired by
       Rockwell Automation brand colours; original design, does not
       reproduce the RA monogram. Fonts fall back gracefully if
       Public Sans is unavailable. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.15" stop-color="#CD163F"/>
      <stop offset="0.95" stop-color="#F58025"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g>
    <path d="M60 4 L108 32 L108 88 L60 116 L12 88 L12 32 Z" fill="url(#brand)"/>
    <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
      <line x1="60" y1="63" x2="60" y2="30"/>
      <line x1="60" y1="63" x2="33" y2="84"/>
      <line x1="60" y1="63" x2="87" y2="84"/>
    </g>
    <circle cx="60" cy="30" r="7.5" fill="#FFFFFF"/>
    <circle cx="33" cy="84" r="7.5" fill="#FFFFFF"/>
    <circle cx="87" cy="84" r="7.5" fill="#FFFFFF"/>
    <circle cx="60" cy="63" r="15" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="60" cy="63" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="132" y="66" font-family="'Public Sans', Arial, sans-serif"
        font-size="46" font-weight="700" fill="#2D2A26">GRC<tspan fill="#CD163F"> Hub</tspan></text>

  <!-- Strapline -->
  <text x="134" y="94" font-family="'Public Sans', Arial, sans-serif"
        font-size="15" letter-spacing="4" fill="#6D6E71">AI GOVERNANCE &amp; CONTROL</text>
</svg>
