<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" preserveAspectRatio="xMaxYMid slice">
  <!-- Decorative hero background: governance "network mesh" echoing the
       logo's hub-and-node motif. Transparent base; designed to layer
       over the dark red gradient at low opacity so white heading text
       keeps its contrast (WCAG 1.4.3). Applied via CSS background-image,
       so it is invisible to assistive technology (decorative by design). -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" fill="none">
    <path d="M370 60 L450 40 L530 85 L575 45"/>
    <path d="M450 40 L470 130 L545 165"/>
    <path d="M370 60 L340 150 L470 130"/>
    <path d="M340 150 L400 230 L470 130"/>
    <path d="M400 230 L520 250 L545 165"/>
    <path d="M530 85 L545 165"/>
    <path d="M520 250 L590 215"/>
    <path d="M340 150 L255 190 L295 265 L400 230"/>
    <path d="M255 190 L185 130 L235 70 L370 60"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.16">
    <circle cx="450" cy="40" r="4"/>
    <circle cx="530" cy="85" r="3"/>
    <circle cx="575" cy="45" r="2.5"/>
    <circle cx="370" cy="60" r="3.5"/>
    <circle cx="340" cy="150" r="4"/>
    <circle cx="400" cy="230" r="3.5"/>
    <circle cx="520" cy="250" r="3"/>
    <circle cx="590" cy="215" r="2.5"/>
    <circle cx="255" cy="190" r="3"/>
    <circle cx="185" cy="130" r="2.5"/>
    <circle cx="235" cy="70" r="2.5"/>
    <circle cx="295" cy="265" r="2.5"/>
  </g>
  <!-- Ringed hub nodes, echoing the logo's control point -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2">
    <circle cx="470" cy="130" r="9"/>
    <circle cx="545" cy="165" r="6"/>
  </g>
  <circle cx="470" cy="130" r="3.5" fill="#ffffff" fill-opacity="0.25"/>
</svg>
